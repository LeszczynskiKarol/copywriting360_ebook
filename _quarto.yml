project:
  type: book
  output-dir: _book

book:
  title: "Copywriting 360°"
  subtitle: "Od psychologii do konwersji"
  author: "Karol Leszczyński"
  date: "2026"

  chapters:
    - index.qmd
    - chapters/01-wprowadzenie.qmd
    - chapters/02-psychologia-perswazji.qmd
    - chapters/03-badanie-grupy-docelowej.qmd
    - chapters/04-naglowki.qmd
    - chapters/05-lead-pierwszy-akapit.qmd
    - chapters/06-struktura-body-copy.qmd
    - chapters/07-wezwanie-do-dzialania.qmd
    - chapters/08-edycja-redakcja-korekta.qmd
    - chapters/09-copywriting-dla-kanalow.qmd
    - chapters/10-storytelling.qmd
    - chapters/11-seo-copywriting.qmd
    - chapters/12-dlugie-formy-sprzedazowe.qmd
    - chapters/13-copywriting-ecommerce.qmd
    - chapters/14-copywriting-b2b.qmd
    - chapters/15-kariera-copywritera.qmd
    - chapters/16-ai-w-copywritingu.qmd

  page-navigation: true

format:
  pdf:
    documentclass: scrbook
    classoption:
      - twoside
      - openright
      - 12pt
      - DIV=12
      - BCOR=12mm
    papersize: a4

    include-in-header: _header.tex

    pdf-engine: xelatex

    mainfont: "Libertinus Serif"
    sansfont: "Fira Sans"
    monofont: "Fira Code"

    fontsize: 12pt
    linestretch: 1.15

    geometry:
      - top=25mm
      - bottom=25mm
      - inner=25mm
      - outer=20mm

    toc: true
    toc-depth: 2
    toc-title: "Spis treści"

    number-sections: true
    number-depth: 2

    keep-tex: true
    include-before-body:
      text: |
        \pagenumbering{gobble}
        \pagecolor{deepnavy}
        \includepdf[pages=1]{cover.pdf}
        \pagecolor{white}
        \null\thispagestyle{empty}\clearpage
        \input{_frontmatter.tex}

lang: pl
